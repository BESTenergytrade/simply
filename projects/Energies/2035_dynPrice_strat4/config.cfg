#--------------------------
# scenario
#--------------------------
# load existing scenario
load_scenario = True
# possible data_formats: json, csv
data_format = csv

#--------------------------
# market
#--------------------------
# start timestep
start_date = 2011-06-06
# number of timesteps in simulation
nb_ts = 168
# interval between simulation timesteps
ts_per_hour = 1

# which market type to use? fair, pac
market_type = fair
# reset market after each interval (discard unmatched orders)
reset_market = True
# size of energy units to be traded individually # was 0.01
energy_unit = 0.1
# factor describing the relation of grid fee to cumulative power network edge weights
weight_factor = 0.0773
local_grid_fee = 0.0773
# default grid_fee to be used by market maker
default_grid_fee = 0.0773

#--------------------------
# output
#--------------------------
# print debug info to console
show_prints = true
# show various plots
show_plots = false
# save orders and matching results to csv files
save_csv = true
#--------------------------
